name: Arabic localization validation

on:
  push:
    branches:
      - arabic-localization
  workflow_dispatch:

jobs:
  build:
    name: Compile localization packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Arabic font
        run: |
          mkdir -p .scripts/arabic-font
          curl -fL --retry 3 "https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSansArabic/NotoSansArabic-Regular.ttf" -o .scripts/arabic-font/Default.ttf
          curl -fL --retry 3 "https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/OFL.txt" -o .scripts/arabic-font/OFL.txt

      - name: Validate Arabic CSV files
        run: python3 .scripts/validate_arabic.py

      - name: Build localization packages
        run: |
          chmod +x .scripts/release.sh .scripts/dacode .scripts/vdfs
          .scripts/release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gothic-1-localization-build
          path: |
            release/release/Gothic_1_Localized.zip
            release/Gothic_1_Localized_code.zip
          if-no-files-found: error
